name: build and deploy

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  CLUSTER_NAME: ${{ vars.CLUSTER_NAME || 'capstone-shop' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: vote tests
        working-directory: vote
        run: |
          python -m pip install -r requirements.txt pytest
          pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: result tests
        working-directory: result
        run: node test/scores.test.js

      - name: worker builds
        run: |
          docker run --rm -v "$PWD/worker:/src" -w /src \
            mcr.microsoft.com/dotnet/sdk:7.0.410 \
            dotnet build -c Release

  scan-and-build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vote
            context: ./vote
          - name: result
            context: ./result
          - name: worker
            context: ./worker
    steps:
      - uses: actions/checkout@v4

      - name: image name
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=ghcr.io/${owner}/voting-${{ matrix.name }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: login to ghcr
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: final
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          output: trivy-${{ matrix.name }}.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: keep the scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.name }}
          path: trivy-${{ matrix.name }}.txt

      - name: push
        if: github.event_name == 'push'
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  deploy:
    needs: scan-and-build
    if: github.event_name == 'push' && vars.DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - uses: azure/setup-kubectl@v4

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"

      - name: image names
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "OWNER=${owner}" >> "$GITHUB_ENV"

      - name: helm upgrade
        run: |
          helm upgrade --install voting helm/voting-app \
            --namespace voting --create-namespace \
            --set imagePullSecret=ghcr \
            --set vote.image.repository=ghcr.io/${OWNER}/voting-vote \
            --set vote.image.tag=${{ github.sha }} \
            --set result.image.repository=ghcr.io/${OWNER}/voting-result \
            --set result.image.tag=${{ github.sha }} \
            --set worker.image.repository=ghcr.io/${OWNER}/voting-worker \
            --set worker.image.tag=${{ github.sha }}
