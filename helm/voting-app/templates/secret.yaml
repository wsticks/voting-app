apiVersion: v1
kind: Secret
metadata:
  name: voting-db
  labels:
    app: db
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.db.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.db.password | quote }}
  POSTGRES_DB: {{ .Values.db.name | quote }}
  DATABASE_URL: {{ printf "postgres://%s:%s@db/%s" .Values.db.user .Values.db.password .Values.db.name | quote }}
